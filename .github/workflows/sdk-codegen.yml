name: sdk-codegen

# API-V261-04 (Phase 70) — TypeScript SDK drift detection gate.
#
# CONTEXT.md decisions (LOCKED):
#   - Trigger: pull_request + push to master, scoped to clients/typescript/**
#     and src/ufc_prediction/contracts/openapi*.json paths
#   - Also workflow_dispatch (manual)
#   - Node 20 (matches clients/typescript/package.json::engines.node ">=20.0.0")
#   - Single job: codegen-drift-check
#       npm ci → npm run codegen:check (regenerate + git diff --exit-code sentinel)
#   - codegen:check is defined in clients/typescript/package.json (line 16):
#       "./codegen.sh && git diff --exit-code src/v1/predict.ts"
#     Non-zero exit on any byte-level drift → PR fails.
#
# Branch protection (operator-managed via GitHub Settings → Branches per
# CONTRIBUTING.md) requires this workflow status check to pass before PRs
# touching the SDK surface can merge into master.

on:
  pull_request:
    paths:
      - "clients/typescript/**"
      - "src/ufc_prediction/contracts/openapi*.json"
      - ".github/workflows/sdk-codegen.yml"
  push:
    branches: [master]
    paths:
      - "clients/typescript/**"
      - "src/ufc_prediction/contracts/openapi*.json"
      - ".github/workflows/sdk-codegen.yml"
  workflow_dispatch:

concurrency:
  group: sdk-codegen-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  codegen-drift-check:
    name: Codegen drift sentinel (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Regenerate types + assert no drift
        # npm run codegen:check runs:
        #   ./codegen.sh && git diff --exit-code src/v1/predict.ts
        # The script regenerates src/v1/predict.ts from
        # src/ufc_prediction/contracts/openapi.v1.3.0.json via
        # openapi-typescript@^7. If the regenerated bytes differ from the
        # committed file (drift), git diff --exit-code returns non-zero
        # and the workflow fails.
        run: npm run codegen:check
