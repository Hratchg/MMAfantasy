# Phase 50 DX-V26-01 — pre-commit framework.
#
# Hooks:
#   - ruff (lint + format)
#   - mypy (strict subset — pilot allow-list; Phase 51 expands)
#   - trailing-whitespace + end-of-file-fixer
#   - audit-01-protected-files (custom local hook; CONTRIBUTING.md L58-78)
#
# Install + use:
#   uv tool install pre-commit && pre-commit install
#   pre-commit run --all-files     # one-shot
#   git commit --no-verify ...     # discouraged (use AUDIT01_OVERRIDE=1
#                                  # for protected files; for other hooks
#                                  # always investigate the failure first)
#
# CI: `.github/workflows/ci.yml :: pre-commit` job runs all hooks against
# every PR. The matrix mirrors the local invocation.

# Older Python language version pin so the hook tools install reliably on
# minimal CI runners.
default_language_version:
  python: python3.13

repos:
  # Whitespace + EOF hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Generated model-metadata JSON, byte-exact scraper/test fixtures, and the
      # Alembic-generated migrations/README are intentionally byte-frozen (drift
      # sentinels + parser fixtures assert on their exact bytes). The auto-fixing
      # whitespace hooks must not rewrite them, or `--all-files` runs fail by
      # modifying committed artifacts.
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            models/.*\.json|
            tests/.*fixtures/.*|
            migrations/README
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            models/.*\.json|
            tests/.*fixtures/.*|
            migrations/README
          )$
      - id: check-yaml
        exclude: ^\.github/workflows/.*\.yml$  # GH Actions YAML uses on: which check-yaml mis-parses
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # Ruff lint + format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14  # match the version pinned in uv.lock so pre-commit and CI agree
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy strict — pilot allow-list (pyproject.toml [tool.mypy] files=).
  # Runs as a local `uv run mypy` hook (not mirrors-mypy) so it type-checks in
  # the project venv where every runtime dependency (sqlalchemy, fastapi,
  # pydantic, …) is resolvable. The mirrors-mypy isolated venv only had a
  # handful of `additional_dependencies`, so it failed every import in
  # `pre-commit run --all-files` with import-not-found. `pass_filenames: false`
  # keeps the `[tool.mypy] files` allow-list as the source of truth.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, allow-list)
        entry: uv run mypy --config-file=pyproject.toml
        language: system
        pass_filenames: false
        always_run: true

  # AUDIT-01 protected-file guard — CONTRIBUTING.md L58-78.
  - repo: local
    hooks:
      - id: audit-01-protected-files
        name: AUDIT-01 protected-file guard
        entry: uv run python scripts/check_audit01_protected_files.py
        language: system
        pass_filenames: true
        always_run: true
        # Override mechanism: set AUDIT01_OVERRIDE=1 in env to bypass.
        # Bypassing without operator approval is a CONTRIBUTING.md
        # violation; the override is itself audited by leaving a shell-
        # history trace and a PR-description checkbox citation.
