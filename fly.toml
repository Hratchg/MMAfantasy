# fly.toml — Fly.io deployment configuration for UFC Fight Prediction
# v2.4 Phase 36 DEPLOY-V24-04
#
# Operator setup:
#   1. fly launch --no-deploy           (creates app, picks name)
#   2. fly postgres create              (creates managed Postgres)
#   3. fly postgres attach <pg-app>     (sets DATABASE_URL secret)
#   4. fly secrets set UFC_API_KEYS=partner-alpha:replace-with-real-secret
#   5. fly secrets set UFC_CORS_ORIGINS=https://your-partner.example.com
#   6. fly secrets set SENTRY_DSN=https://... (optional)
#   7. fly deploy

app = "ufc-fight-prediction-CHANGEME"
primary_region = "iad"

[build]

[env]
  UFC_ENV = "prod"
  PORT = "8080"

[deploy]
  release_command = "uv run alembic upgrade head"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
