# External libraries without bundled type stubs — silenced here so the
# pilot allow-list expansion in Phase 51 is not bottlenecked by external
# library hygiene.
[[tool.mypy.overrides]]
module = [
    "pythonjsonlogger.*",
    "rapidfuzz.*",
    # Phase 51 (DX-V26-02 / DX-V26-03) admit-list expansion — external
    # libraries without bundled type stubs surface as `import-untyped`
    # errors when consuming modules are added to the strict allow-list.
    # These libraries are inherently typed loosely and not on the v2.6
    # critical path for hint coverage.
    "kagglehub.*",
    "xgboost.*",
    "sklearn.*",
    "scipy.*",
    "joblib.*",
    "bs4.*",
    "pandas.*",
    "networkx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: phase-locked invariant/integration tests (Phase 29-02+; subprocess + spike-based)",
    "slow: long-running tests excluded from default CI runs (Phase 38 HYGIENE-V24-05; CI uses -m 'not slow')",
    "integration: real-DB integration tests requiring testcontainers Postgres (Phase 41 BFO-V25-03+; skipped when Docker daemon unavailable)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "testcontainers>=4.14.2",
    "factory-boy>=3.3.3",
    "ruff>=0.15.10",
    "hypothesis>=6.152.7",
    "openapi-spec-validator>=0.8.5",
    # pre-commit ships in the dev group (not a separate `uv tool install`) so a
    # fresh `uv sync` puts it in the project venv and `uv run pre-commit install`
    # works identically on every clone — closes OPS-V30-01 (hook missing on some
    # clones because the git hook was never installed).
    "pre-commit>=4.0,<5",
    # mypy runs via the local pre-commit hook (`uv run mypy`) so it type-checks
    # in the project venv with all runtime deps resolvable — the mirrors-mypy
    # isolated venv could not see sqlalchemy/fastapi/etc. Pinned to the 1.13.x
    # line the hook previously used.
    "mypy>=1.13.0,<1.14",
]
